<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Rise ERP</title>
  <meta http-equiv="refresh" content="0; url=erp/">
  <link rel="canonical" href="erp/">
  <style>
    html,body{height:100%;margin:0;background:#0f172a;color:#e2e8f0;
      font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    a{color:#60a5fa}
  </style>
</head>
<body>
  <div class="wrap">
    <div style="font-size:16px;font-weight:600">Abriendo Rise ERP…</div>
    <div style="font-size:13px;color:#94a3b8">Si no redirige solo, <a href="erp/">entrá acá</a>.</div>
  </div>
  <script>
    // Neutralizar la SW vieja de la raíz (app ConstructERP) para que no vuelva a
    // controlar /Humand/ ni servir contenido cacheado antiguo. La app real vive en /erp/
    // y tiene su propia SW.
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              // desregistrar solo la de scope raíz, no la de /erp/
              if (r.scope && r.scope.indexOf('/erp/') === -1) r.unregister();
            });
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) { ks.forEach(function (k) { if (/erp-v\d+/.test(k)) caches.delete(k); }); }).catch(function () {});
        }
      } catch (e) {}
      location.replace('erp/');
    })();
  </script>
</body>
</html>
